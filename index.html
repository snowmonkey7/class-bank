<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#43A66C">
  <title>一班銀行</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="student">
  <header class="topbar">
    <div class="wrap topbar-row">
      <div class="brand"><span id="logo"></span><span class="brand-name">一班銀行</span></div>
      <a class="pill-link" href="teacher.html">教師端</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-live="polite">
      <div class="hero-text">
        <p class="hero-date" id="drawDate"></p>
        <h1 class="hero-title">今日抽卡金額</h1>
        <p class="hero-sub" id="drawSub">抽一次卡要付的鱷魚卡張數</p>
      </div>
      <div class="coin" id="coin">
        <span class="coin-num" id="drawPrice">–</span>
        <span class="coin-unit">張</span>
      </div>
    </section>

    <section class="list-sec">
      <h2 class="sec-title">找到自己的銀行卡，點一下</h2>
      <div id="cardList" class="card-list"><p class="empty">讀取中…</p></div>
    </section>
    <p id="demoNote" class="note" hidden>目前是試用模式：資料只存在這台裝置。完成 Firebase 設定後，全班平板就會同步。</p>
  </main>

  <!-- 輸入後四碼 -->
  <dialog id="pinDialog" class="sheet pin-dialog" aria-labelledby="pinName">
    <div class="pin-box">
      <div class="pin-card" id="pinCard"></div>
      <p class="pin-hint">輸入卡號的<b>最後四碼</b></p>
      <div class="pin-dots" id="pinDots" aria-live="polite"><span></span><span></span><span></span><span></span></div>
      <p class="pin-error" id="pinError" role="alert"></p>
      <div class="keypad" id="keypad">
        <button type="button">1</button><button type="button">2</button><button type="button">3</button>
        <button type="button">4</button><button type="button">5</button><button type="button">6</button>
        <button type="button">7</button><button type="button">8</button><button type="button">9</button>
        <button type="button" data-k="close" class="k-soft">取消</button><button type="button">0</button><button type="button" data-k="back" class="k-soft" aria-label="刪除一碼">⌫</button>
      </div>
    </div>
  </dialog>

  <!-- 我的銀行卡 -->
  <dialog id="cardDialog" class="sheet card-dialog" aria-labelledby="cvName">
    <div class="card-view">
      <button type="button" class="back-btn" id="closeCard"><span id="backIc"></span>回到名單</button>
      <div class="cv-grid">
        <div class="flip-stage">
          <div class="flip" id="flip">
            <div class="flip-face flip-back" id="cvBack"></div>
            <img class="flip-face flip-front" id="cvImg" alt="">
          </div>
          <p class="cv-no" id="cvNo"></p>
        </div>
        <div class="cv-bal">
          <p class="cv-name" id="cvName"></p>
          <p class="cv-label">我的存款</p>
          <p class="cv-amount"><span id="cvBalance">0</span><small>張鱷魚卡</small></p>
          <p class="cv-design" id="cvSub"></p>
        </div>
      </div>
      <h3 class="ledger-title">存摺紀錄</h3>
      <ol class="entries" id="cvLedger"></ol>
    </div>
  </dialog>

  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/store.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
